{% extends "base.html" %}

{% block title %}
MotorNation — Server Error
{% endblock %}

{% block content %}

<section class="error-page">

    <div class="container">

        <span class="eyebrow">
            MOTOR NATION
        </span>

        <h1>
            500
        </h1>

        <h2>
            Something Went Wrong
        </h2>

        <p>
            MotorNation encountered an unexpected server error.
            Please try again in a moment.
        </p>

        <a
            href="{{ url_for('home') }}"
            class="primary-btn"
        >
            Back to Home
        </a>

    </div>

</section>

{% endblock %}
