services:
  - type: web
    name: motornation
    runtime: python
    plan: free
    region: oregon
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.0
      - key: MOTORNATION_SECRET_KEY
        generateValue: true
      - key: MOTORNATION_ADMIN_PASSWORD
        value: admin123
